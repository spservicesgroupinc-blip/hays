<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Base container with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.4" />

  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#C81D25" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="8 6" />

  <!-- Main Shield -->
  <g filter="url(#dropShadow)">
    <path d="M256 70
             C330 70 380 96 380 96
             V240
             C380 330 310 400 256 432
             C202 400 132 330 132 240
             V96
             C132 96 182 70 256 70 Z"
          fill="url(#shieldGrad)" />
  </g>

  <!-- Shield Inner Border -->
  <path d="M256 86
           C320 86 362 108 362 108
           V236
           C362 316 300 378 256 408
           C212 378 150 316 150 236
           V108
           C150 108 192 86 256 86 Z"
        fill="none" stroke="#FFFFFF" stroke-width="6" stroke-opacity="0.3" />

  <!-- Camera Aperture / Lens Ring inside Shield -->
  <circle cx="256" cy="226" r="76" fill="#0F172A" />
  <circle cx="256" cy="226" r="68" fill="none" stroke="url(#goldGrad)" stroke-width="6" />
  <circle cx="256" cy="226" r="46" fill="#1E293B" />

  <!-- Camera Lens Glint -->
  <ellipse cx="240" cy="210" rx="14" ry="7" fill="#FFFFFF" fill-opacity="0.3" transform="rotate(-30 240 210)" />

  <!-- Inspection Checkmark & Crosshair Accent -->
  <path d="M224 226 L248 250 L296 196" fill="none" stroke="#22C55E" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Top Hays Cross (+) Accent -->
  <g transform="translate(256, 126)">
    <rect x="-4" y="-12" width="8" height="24" rx="2" fill="#FFFFFF" />
    <rect x="-12" y="-4" width="24" height="8" rx="2" fill="#FFFFFF" />
  </g>

  <!-- Bottom Brand Ribbon Text: FIELDPROOF -->
  <g transform="translate(256, 458)">
    <text text-anchor="middle" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" letter-spacing="5">FIELDPROOF</text>
  </g>
</svg>
